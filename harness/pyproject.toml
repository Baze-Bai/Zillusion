[project]
name = "claude-code-browser-harness-mcp"
version = "0.1.0"
description = "Browser-driven crawler exploration (harness variant) with cross-site skill accumulation"
requires-python = ">=3.12"
dependencies = [
    # Capped below 2. mcp_server/server.py is written against the 1.x
    # `mcp.server.fastmcp` API, which mcp 2.0.0 removed (FastMCP -> MCPServer).
    # Without the cap a fresh `pip install -e .` resolves mcp 2.x today and
    # `import mcp_server.server` dies, which means the Claude Code session comes
    # up with the browser-harness MCP server reported `failed` and the agent has
    # ZERO browser tools — it does not crash, it silently cannot see anything.
    # Lift this only together with a port of server.py to the 2.x API.
    "mcp>=1.0.0,<2",
    "playwright>=1.49.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "claude-agent-sdk>=0.2.0",
    # Vision submodel ("eyes" for a text base model): mcp_server/vision.py builds an
    # AsyncAnthropic client (pointed at the LiteLLM proxy via ANTHROPIC_BASE_URL) to
    # turn a screenshot into a short text answer for browser_vision_probe.
    "anthropic>=0.40",
    # HTTP client for workflow.py media downloads (T3 — image / direct audio / external)
    "httpx>=0.28.0",
    # Reddit / YouTube / generic HLS+mp4 video downloader; uses ffmpeg from PATH
    # for mux. Required for workflow.py video extraction (T3).
    "yt-dlp>=2025.1.0",
    # HTTP library needed by some downloaded generator scripts (e.g.
    # china-hotel-extractor's requests.Session() constructor).
    "requests>=2.31.0",
    # HTML parsing for static-page workflow scrapers (BeautifulSoup with lxml).
    "beautifulsoup4>=4.12.0",
    "lxml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
browser-harness-mcp = "mcp_server.server:main"
crawler-explorer = "runtime.cli:main"

[tool.pytest.ini_options]
# async tests/fixtures run without per-test @pytest.mark.asyncio decoration.
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "browser: launches a real headless Chromium (needs `playwright install chromium`)",
    "network: talks to a real external service (jsonplaceholder smoke) — needs internet",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server", "runtime"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Stated explicitly, because until now this package had no `select` and so
# inherited whatever the installed ruff defaulted to — a set the tool owns and
# changes. It did: ruff 0.16 broadened the defaults and the same unmodified tree
# went from clean to 180 findings. Measured here: 0.14.5 clean, 0.16.5 180
# errors; with this select, both are clean. A lint gate whose rules depend on
# which version pip resolved that morning gates nothing.
#
# This is the floor, not a claim that it is enough. Those 180 include real
# signal (S110 bare try/except/pass, BLE001 blind excepts, UP017 datetime.UTC);
# widening the set is worth doing as its own change, with the fixes attached.
select = ["E4", "E7", "E9", "F"]
