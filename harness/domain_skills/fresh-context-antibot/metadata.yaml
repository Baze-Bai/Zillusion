title: Bypass anti-bot blocks with a fresh browser context
description: Create a fresh Playwright browser context with anti-detection measures
  (realistic UA, viewport, locale, timezone, navigator.webdriver=false, chrome.runtime
  stub, navigator.plugins/languages overrides) instead of using the default attached
  context. Works against Reddit's anti-bot layer and likely transfers to other sites
  with similar browser-fingerprint-based blocking.
when_to_use: The default browser context returns 403, JS challenge pages, or "You've
  been blocked by network security" from the target site. Skip if the default context
  already loads the page normally.
